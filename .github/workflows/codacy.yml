name: Codacy Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "18 14 * * 6"

permissions:
  contents: read

concurrency:
  group: codacy-security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check Codacy project token
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "::error::The CODACY_PROJECT_TOKEN secret is not configured."
            exit 1
          fi

      - name: Run Codacy Analysis CLI
        id: codacy
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        env:
          DOCKER_API_VERSION: "1.40"
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Validate SARIF report
        id: validate
        if: ${{ always() && steps.codacy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="results.sarif"

          if [ ! -f "$REPORT" ]; then
            echo "::error::Codacy did not generate $REPORT."
            exit 1
          fi

          if [ ! -s "$REPORT" ]; then
            echo "::error::The SARIF report is empty."
            exit 1
          fi

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path("results.sarif")

          try:
              with report_path.open(encoding="utf-8") as file:
                  sarif = json.load(file)
          except (json.JSONDecodeError, UnicodeDecodeError) as error:
              print(f"::error::Invalid SARIF JSON: {error}")
              sys.exit(1)

          version = sarif.get("version")
          runs = sarif.get("runs")

          if version != "2.1.0":
              print(f"::error::Unsupported or missing SARIF version: {version!r}")
              sys.exit(1)

          if not isinstance(runs, list) or not runs:
              print("::error::SARIF report contains no runs. GitHub cannot process this report.")
              sys.exit(1)

          total_results = 0

          for index, run in enumerate(runs, start=1):
              if not isinstance(run, dict):
                  print(f"::error::SARIF run {index} is not an object.")
                  sys.exit(1)

              tool = run.get("tool", {})
              driver = tool.get("driver", {}) if isinstance(tool, dict) else {}

              if not isinstance(driver, dict) or not driver.get("name"):
                  print(f"::error::SARIF run {index} has no tool.driver.name.")
                  sys.exit(1)

              results = run.get("results", [])
              if not isinstance(results, list):
                  print(f"::error::SARIF run {index} has an invalid results field.")
                  sys.exit(1)

              total_results += len(results)
              print(f"Run {index}: tool={driver['name']}, results={len(results)}")

          print(f"SARIF version: {version}")
          print(f"Number of runs: {len(runs)}")
          print(f"Total findings: {total_results}")
          print(f"Report size: {report_path.stat().st_size} bytes")
          PY

      - name: Upload SARIF results to GitHub
        if: ${{ steps.validate.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: codacy-security-scan
