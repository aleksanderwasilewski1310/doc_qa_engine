version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector-poc
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      # Store data on local disk (data remains after container stop)
      - pgdata:/var/lib/postgresql/data
      # Database autostart: run SQL script automatically on first startup
      - ./create_table.sql:/docker-entrypoint-initdb.d/create_table.sql

volumes:
  pgdata: