[project]
name = "doc-qa-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aleksanderwasilewski1310", email = "awasilewski1310@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.65",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.27.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
    "pypdf>=3.9.0",
    "psycopg[binary]>=3.2",
    "langchain==1.3.15",
    "langchain-community>=0.4.2",
    "langchain-aws>=0.2.31",
    "ragas>=0.2.15",
    "tiktoken>=0.13.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "pre-commit-hooks>=6.0.0",
]

[project.scripts]
doc-qa-engine = "doc_qa_engine:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pylint.master]
py-version = "3.13"
